  color:#fff;
  padding:20px;
}

/* ================= BACKGROUND ANIMATION ================= */
@keyframes bgMove{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

/* ================= HEADER ================= */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;

  padding:20px;
  border-radius:22px;

  background: linear-gradient(135deg, rgba(124,58,237,0.15), rgba(6,182,212,0.10));
  border:1px solid rgba(255,255,255,0.1);
  backdrop-filter: blur(18px);
  box-shadow:0 15px 40px rgba(0,0,0,0.4);

  position:relative;
  overflow:hidden;
}

/* glow */
.header::before{
  content:"";
  position:absolute;
  width:260px;
  height:260px;
  background:radial-gradient(circle, rgba(124,58,237,0.25), transparent);
  top:-100px;
  right:-100px;
  filter:blur(20px);
}

/* ================= USER ================= */
.user-box{
  display:flex;
  align-items:center;
  gap:12px;
}

.avatar{
  width:55px;
  height:55px;
  border-radius:50%;
  background:linear-gradient(135deg,#7c3aed,#06b6d4);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  box-shadow:0 0 15px rgba(124,58,237,0.4);
  animation:pulse 2s infinite;
}

.user-info h2{
  font-size:18px;
  font-weight:800;
  margin:0;
  background:linear-gradient(90deg,#7c3aed,#06b6d4);
  -webkit-background-clip:text;
  color:transparent;
}

.user-info p{
  font-size:13px;
  opacity:0.85;
  margin:3px 0;
}

/* ================= PROGRESS ================= */
.progress-box{
  flex:1;
  text-align:center;
}

.progress-title{
  font-size:13px;
  margin-bottom:6px;
  opacity:0.8;
}

.progress-bar{
  width:100%;
  height:10px;
  background:rgba(255,255,255,0.08);
  border-radius:20px;
  overflow:hidden;
}

.progress-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#7c3aed,#06b6d4);
  transition:0.4s ease;
}

/* ================= STATUS ================= */
.status-box{
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px 12px;
  border-radius:12px;
  background:rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
}

.status-dot{
  width:10px;
  height:10px;
  border-radius:50%;
  background:#22c55e;
  box-shadow:0 0 10px #22c55e;
  animation:pulse 1.5s infinite;
}

/* ================= STATS ================= */
.stats{
  margin-top:25px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:18px;
}

.card{
  padding:18px;
  border-radius:18px;
  text-align:center;

  background: rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.1);
  backdrop-filter: blur(18px);

  transition:0.3s;
}

.card:hover{
  transform: translateY(-6px);
}

.card span{
  display:block;
  font-size:22px;
  font-weight:900;
  margin-top:8px;
}

/* colors */
.card.total{border-color:#6366f1}
.card.percent{border-color:#06b6d4}
.card.correct{border-color:#22c55e}
.card.wrong{border-color:#ef4444}

/* ================= QUESTIONS ================= */
.questions{
  margin-top:25px;
  display:flex;
  flex-direction:column;
  gap:20px;
}

/* CARD */
.q-card{
  background: rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:18px;
  overflow:hidden;
  backdrop-filter: blur(15px);
}

/* QUESTION TOP */
.q-title{
  padding:12px;
  text-align:center;
  font-weight:800;
  background: rgba(0,0,0,0.25);
}

/* BODY */
.q-body{
  display:flex;
  gap:15px;
  padding:15px;
  align-items:stretch;
}

/* LEFT ANSWERS */
.answers{
  flex:1;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.answer{
  padding:12px;
  border-radius:12px;
  background: rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.08);
  transition:0.3s;
}

.answer:hover{
  transform:scale(1.02);
}

/* correct / wrong */
.correct{
  background:#22c55e !important;
  color:white;
}

.wrong{
  background:#ef4444 !important;
  color:white;
}

/* ================= IMAGE RIGHT FULL ================= */
.q-media{
  flex:1;
  display:flex;
}

.q-image{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:14px;
}

/* ================= RESPONSIVE ================= */
@media(max-width:768px){
  .header{
    flex-direction:column;
    text-align:center;
  }

  .q-body{

  }

}

pointer-events:none;

}

/* Shine */

.q-card::after{

content:"";

position:absolute;

left:-120%;

top:0;

width:45%;

height:100%;

background:

linear-gradient(
90deg,
transparent,
rgba(255,255,255,.28),
transparent);

transform:skewX(-25deg);

animation:shine 6s infinite;

}

/* Hover */

.q-card:hover{

transform:

translateY(-10px)

scale(1.01);

box-shadow:

0 30px 70px rgba(0,0,0,.45);

}

/* Header */

.q-header{

display:flex;

justify-content:space-between;

align-items:center;

padding:18px 22px;

background:

rgba(255,255,255,.03);

border-bottom:

1px solid rgba(255,255,255,.08);

}

/* Question Number */

.question-number{

padding:8px 18px;

border-radius:40px;

background:

linear-gradient(
135deg,
#7c3aed,
#06b6d4);

font-weight:700;

font-size:14px;

}

/* Status */

.status{

padding:8px 18px;

border-radius:30px;

font-size:13px;

font-weight:bold;

}

.correct-status{

background:#22c55e;

}

.wrong-status{

background:#ef4444;

}

/* Question */

.q-title{

padding:28px;

font-size:24px;

font-weight:800;

line-height:2;

text-align:right;

}

/* Body */

.q-body{

padding:25px;

display:grid;

grid-template-columns:1fr 1fr;

gap:25px;

align-items:stretch;

}

/* Answers */

.answers{

display:flex;

flex-direction:column;

gap:14px;

}

/* Every Answer */

.answer{

padding:18px;

border-radius:18px;

background:

rgba(255,255,255,.05);

border:

1px solid rgba(255,255,255,.08);

transition:.35s;

font-size:16px;

}

.answer:hover{

transform:translateX(-8px);

background:

rgba(255,255,255,.08);

}

/* Correct */

.answer.correct{

background:

linear-gradient(
135deg,
#16a34a,
#22c55e)!important;

}

/* Wrong */

.answer.wrong{

background:

linear-gradient(
135deg,
#dc2626,
#ef4444)!important;

}

/* Image */

.q-media{

display:flex;

justify-content:center;

align-items:center;

}

.q-image{

width:100%;

border-radius:22px;

cursor:pointer;

transition:.5s;

box-shadow:

0 15px 35px rgba(0,0,0,.35);

}

.q-image:hover{

transform:

scale(1.05);

}

/* Analysis Button */

.analysis-btn{

width:100%;

margin-top:18px;

padding:16px;

border:none;

border-radius:18px;

background:

linear-gradient(
135deg,
#7c3aed,
#06b6d4);

font-size:15px;

font-weight:bold;

cursor:pointer;

transition:.35s;

}

.analysis-btn:hover{

transform:translateY(-4px);

}

/* Analysis */

.analysis-box{

margin-top:15px;

padding:18px;

border-radius:18px;

background:

rgba(255,255,255,.06);

border:

1px solid rgba(255,255,255,.08);

line-height:2;

font-size:15px;

}

.q-card.success{
    border:2px solid #22c55e;
    box-shadow:
        0 0 20px rgba(34,197,94,.3),
        0 0 50px rgba(34,197,94,.15);
    animation:successPop .6s ease;
}

@keyframes successPop{
0%{
transform:scale(.9);
opacity:0;
}
60%{
transform:scale(1.03);
}
100%{
transform:scale(1);
opacity:1;
}
}

.q-card.danger{
border:2px solid #ef4444;
box-shadow:
0 0 18px rgba(239,68,68,.3),
0 0 40px rgba(239,68,68,.15);
animation:wrongShake .55s;
}

@keyframes wrongShake{

0%,100%{transform:translateX(0);}
20%{transform:translateX(-6px);}
40%{transform:translateX(6px);}
60%{transform:translateX(-4px);}
80%{transform:translateX(4px);}
}

.q-card.blank{
border:2px dashed #64748b;
box-shadow:0 0 20px rgba(100,116,139,.2);
animation:blankPulse 2.5s infinite;
}

@keyframes blankPulse{

0%,100%{
box-shadow:0 0 10px rgba(100,116,139,.15);
}

50%{
box-shadow:0 0 35px rgba(100,116,139,.35);
}
}

.question-state.success{
    color:#22c55e;
    font-weight:700;
    display:flex;
    align-items:center;
    gap:8px;
}

.question-state.success .icon{
    display:inline-block;
    animation:correctIcon .8s ease;
}

.question-state.success .text{
    animation:shine 1.5s infinite;
}

@keyframes correctIcon{
0%{transform:scale(0) rotate(-180deg);}
70%{transform:scale(1.25) rotate(15deg);}
100%{transform:scale(1) rotate(0);}
}

@keyframes shine{
0%,100%{opacity:1;text-shadow:0 0 0 transparent;}
50%{text-shadow:0 0 18px #22c55e;}
}

.question-state.danger{
    color:#ef4444;
    font-weight:700;
    display:flex;
    align-items:center;
    gap:8px;
}

.question-state.danger .icon{
    animation:wrongIcon .6s ease;
}

.question-state.danger .text{
    animation:wrongText .6s ease;
}

@keyframes wrongIcon{
0%,100%{transform:rotate(0);}
20%{transform:rotate(-18deg);}
40%{transform:rotate(18deg);}
60%{transform:rotate(-10deg);}
80%{transform:rotate(10deg);}
}

@keyframes wrongText{
0%,100%{transform:translateX(0);}
25%{transform:translateX(-3px);}
50%{transform:translateX(3px);}
75%{transform:translateX(-2px);}
}

.question-state.blank{
    color:#94a3b8;
    display:flex;
    gap:8px;
    align-items:center;
}

.question-state.blank .icon{
    animation:floatIcon 2s ease-in-out infinite;
}

@keyframes floatIcon{
0%,100%{transform:translateY(0);}
50%{transform:translateY(-5px);}
}
</style>
</head>

<body>

<div class="header">

  <!-- LEFT: Avatar + Info -->
<div class="user-box">

    <div class="avatar">
        👤
    </div>

    <div class="user-info">

        <h2 id="studentName">...</h2>

        <div class="info-row">

            <div class="info-chip">

                <span>🆔</span>

                <p id="studentCode"></p>

            </div>

            <div class="info-chip">

                <span>📝</span>

                <p id="examName"></p>

            </div>

        </div>

    </div>

</div>

  <!-- MIDDLE: Progress -->
  <div class="progress-box">
    <div class="progress-title">📊 التقدم</div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <!-- RIGHT: Status -->
  <div class="status-box">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">داخل الامتحان</span>
  </div>

</div>
<section class="stats-section">

<div class="stats-header">

    <div class="stats-line"></div>

    <div class="stats-title">

        <span class="stats-icon">📊</span>

        <div>
            <h2>ملخص النتيجة</h2>
            <p>إحصائيات أداء الطالب في الامتحان</p>
        </div>

    </div>

</div>

<div class="stats">

<div class="card total">
    <div class="card-glow"></div>

    <div class="card-icon">
        📚
    </div>

    <div class="card-title">
        إجمالي الأسئلة
    </div>

    <span id="totalQ">0</span>

    <small>Question Count</small>

</div>

<div class="card percent">

    <div class="card-glow"></div>

    <div class="card-icon">
        🎯
    </div>

    <div class="card-title">
        النسبة
    </div>

    <span id="percent">0%</span>

    <div class="badge" id="badge">
        جاري التقييم...
    </div>

</div>

<div class="card correct">

    <div class="card-glow"></div>

    <div class="card-icon">
        ✅
    </div>

    <div class="card-title">
        الإجابات الصحيحة
    </div>

    <span id="correct">0</span>

    <small>Correct Answers</small>

</div>

<div class="card wrong">

    <div class="card-glow"></div>

    <div class="card-icon">
        ❌
    </div>

    <div class="card-title">
        الإجابات الخاطئة
    </div>

    <span id="wrong">0</span>

    <small>Wrong Answers</small>

</div>

</div>

</section>
<div class="stats-header">

    <div class="stats-line"></div>

    <div class="stats-title">

        <span class="stats-icon">📊</span>

        <div>
            <h2>تحليل الاسئلة</h2>
            <p>إحصائيات أداء الطالب في الامتحان</p>
        </div>

    </div>

</div>

<div class="questions" id="questions"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

/* ================= FIREBASE ================= */
const firebaseConfig = {
  apiKey: "AIzaSyB6_HkPcbAhyZG8joikJr_kPK-6UACxldg",
  authDomain: "plat-form-97b8d.firebaseapp.com",
  projectId: "plat-form-97b8d",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ================= STUDENT DATA ================= */
const studentId = localStorage.getItem("studentId");
const studentName = localStorage.getItem("studentName") || "طالب";
const studentCode = localStorage.getItem("studentCode") || "—";

/* ================= HEADER ================= */
document.getElementById("studentName").innerText = studentName;
document.getElementById("studentCode").innerText = studentCode;

/* ================= ANALYSIS TOGGLE ================= */
window.toggleAnalysis = function(btn){
  const box = btn.nextElementSibling;
  if(!box) return;
  box.style.display = box.style.display === "block" ? "none" : "block";
};

/* ================= LOAD RESULT ================= */
async function loadResult(){

  try{

    if(!studentId){
      console.error("No studentId");
      return;
    }

    const resultSnap = await getDocs(
      collection(db,"students",studentId,"exams")
    );

    if(resultSnap.empty){
      console.error("No result found");
      return;
    }

    const result = resultSnap.docs[0].data();

    const examName = result.examName || "—";
    const answers = result.answers || {};

    /* ================= HEADER INFO ================= */
      const percent = result.percent || 0;

const correct = result.correct || 0;

const wrong = result.wrong || 0;

const total =
correct +
wrong +
(result.blank || 0);

animateCounter("percent", percent, "%");

animateCounter("correct", correct);

animateCounter("wrong", wrong);

animateCounter("totalQ", total);

updateBadge(percent);

    /* ================= PROGRESS ================= */
    const progress = document.getElementById("progressFill");
    if(progress){
      setTimeout(()=>{
        progress.style.width = (result.percent || 0) + "%";
      },300);
    }

    /* ================= STATUS ================= */
    const statusBox = document.getElementById("statusBox");
    const statusText = document.getElementById("statusText");

    let reason = result.exitReason || "تم تسليم الامتحان بنجاح";

    if(statusText) statusText.innerText = reason;

    if(statusBox){
      statusBox.classList.remove("status-normal","status-warn","status-danger");

      if(reason.includes("وقت")){
        statusBox.classList.add("status-warn");
      }
      else if(reason.includes("غش")){
        statusBox.classList.add("status-danger");
      }
      else{
        statusBox.classList.add("status-normal");
      }
    }

    /* ================= GET EXAM ================= */
    const examsSnap = await getDocs(collection(db,"exams"));

    let examDoc = null;

    examsSnap.forEach(doc=>{
      if(doc.data().name === examName){
        examDoc = doc;
      }
    });

    if(!examDoc){
      console.error("Exam not found");
      return;
    }

    /* ================= QUESTIONS ================= */
    const qSnap = await getDocs(
      collection(db,"exams",examDoc.id,"questions")
    );

    const container = document.getElementById("questions");
    container.innerHTML = "";

    let i = 0;

    qSnap.forEach(docSnap=>{

      const q = docSnap.data();
      const userAnswer = answers[i];

      const card = document.createElement("div");
      if(userAnswer === undefined){
    card.className = "q-card blank";
}
else if(userAnswer === q.correct){
    card.className = "q-card success";
}
else{
    card.className = "q-card danger";
}

      /* ================= ANSWERS ================= */
      const answersHTML = (q.answers || []).map((a,idx)=>{

        let cls = "answer";

        if(idx === q.correct) cls += " correct";
        if(userAnswer === idx && userAnswer !== q.correct) cls += " wrong";

        return `<div class="${cls}">${a}</div>`;
      }).join("");

      /* ================= CARD ================= */
      card.innerHTML = `

<div class="q-header">

    <div class="question-number">
        السؤال ${i + 1}
    </div>

    <div class="${
        userAnswer===q.correct
        ?
        "question-state success"
        :
        "question-state danger"
    }">

        ${
        userAnswer===q.correct
        ?
        "✔ صحيحة"
        :
        "✖ خاطئة"
        }

    </div>

</div>

<div class="q-title">

${q.text || "سؤال"}

</div>

<div class="q-body">

<div class="answers">

${answersHTML}

<div class="answer ${
userAnswer===q.correct
?
"correct"
:
"wrong"
}">

<b>إجابتك</b>

<br>

${
userAnswer!==undefined
?
q.answers[userAnswer]
:
"لم تتم الإجابة"
}

</div>

${
q.analysis
?
`
<button class="analysis-btn"
onclick="toggleAnalysis(this)">
📖 عرض التحليل
</button>

<div class="analysis-box">
${q.analysis}
</div>
`
:
""
}

</div>

${
q.image
?
`
<div class="q-media">

<img
src="${q.image}"
class="q-image"
loading="lazy">

</div>
`
:
""
}

</div>

`;
      container.appendChild(card);
      i++;
    });

  }
  catch(err){
    console.error("RESULT ERROR:",err);
  }
}

/* ================= ANIMATE COUNTER ================= */

function animateCounter(id, target, suffix = "") {

    const element = document.getElementById(id);

    let current = 0;

    const step = Math.max(1, Math.ceil(target / 60));

    const timer = setInterval(() => {

        current += step;

        if (current >= target) {

            current = target;

            clearInterval(timer);

        }

        element.innerText = current + suffix;

    }, 20);

}

/* ================= BADGE ================= */

function updateBadge(percent){

    const badge = document.getElementById("badge");

    if(!badge) return;

    if(percent >= 95){

        badge.innerHTML="🏆 Elite";

        badge.style.background="#f59e0b";

    }

    else if(percent >= 90){

        badge.innerHTML="🥇 ممتاز";

        badge.style.background="#22c55e";

    }

    else if(percent >= 80){

        badge.innerHTML="🥈 جيد جداً";

        badge.style.background="#06b6d4";

    }

    else if(percent >= 70){

        badge.innerHTML="🥉 جيد";

        badge.style.background="#6366f1";

    }

    else{

        badge.innerHTML="📘 يحتاج مراجعة";

        badge.style.background="#ef4444";

    }

}

/* ================= START ================= */
loadResult();
</script>

</body>
</html>
